name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    name: Cypress — E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          fail-on-cache-miss: false

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Build de produção
        working-directory: frontend
        run: npm run build

      # 🔥 CORREÇÃO: Agora o Cypress é executado na RAÍZ do projeto,
      # para que ele possa encontrar o arquivo cypress.config.js que está lá.
      - name: Cypress run (E2E)
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm --prefix frontend run preview -- --port 5173
          wait-on: "http://localhost:5173"
          wait-on-timeout: 120
          record: true
          config-file: cypress.config.js
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  component-tests:
    name: Cypress — Component Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          fail-on-cache-miss: false

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      # 🔥 CORREÇÃO: O Component Testing usa o arquivo de configuração
      # que está DENTRO da pasta frontend/.
      - name: Cypress run (component)
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: frontend
          component: true
          config-file: cypress.config.js
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
