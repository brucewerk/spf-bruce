name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Build de produção
        working-directory: frontend
        run: npm run build

      # cypress.config.js e cypress/ ficam na raiz do repositório, então a
      # action roda a partir daqui — só o servidor de preview é que precisa
      # ser iniciado de dentro de frontend/.
      #
      # Os testes de smoke (cypress/e2e/auth.cy.js) só cobrem telas públicas
      # (login/registro/redirecionamento) — não dependem do backend nem de
      # um MongoDB rodando, então `vite preview` sozinho é suficiente aqui.
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm --prefix frontend run preview -- --port 5173
          wait-on: "http://localhost:5173"

  component-tests:
    name: Cypress — Component Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # cypress.config.js do component testing vive dentro de frontend/
      # (precisa resolver o vite.config.js e o Tailwind deste projeto),
      # diferente do e2e acima, cujo config está na raiz. Por isso aqui
      # working-directory aponta pra frontend/ e install fica a cargo da
      # própria action (ela cuida do cache do binário do Cypress).
      - name: Cypress run (component)
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          component: true
