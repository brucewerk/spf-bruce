name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Gerar package-lock (se necessário)
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
          # 🔥 Força o GitHub a não parar o build se o cache falhar
          fail-on-cache-miss: false

      - name: Instalar dependências
        run: npm ci

      # O teste de contrato (authSchema.contract.test.js) importa a cópia do
      # schema que vive em frontend/src/schemas/ pra garantir que as duas
      # nunca fiquem dessincronizadas — por isso esse job também precisa do
      # frontend instalado, mesmo só testando o backend.
      - name: Instalar dependências do frontend (para o teste de contrato)
        working-directory: frontend
        run: npm ci

      - name: Rodar testes
        run: npm test
        env:
          NODE_ENV: test

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Gerar package-lock (se necessário)
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          # 🔥 Força o GitHub a não parar o build se o cache falhar
          fail-on-cache-miss: false

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build
